name: Compatibility and release checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  MPLBACKEND: Agg

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pip check
      - run: python -m pytest tests -m "not slow" --tb=short

  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install ".[test]"
      - run: python -m pytest tests -m slow --tb=short

  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ".[docs,test]" build cffconvert
      - run: cffconvert --validate
      - run: python -m sphinx -E -b html -W --keep-going docs docs/_build/html
      - run: python -m build
      - run: python tests/release_candidate_checks.py --artifacts dist --output docs/_build/release-ci --install
